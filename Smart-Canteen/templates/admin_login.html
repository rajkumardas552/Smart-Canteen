{% extends 'base.html' %}

{% block title %}Admin Login | Smart Canteen{% endblock %}

{% block content %}
<div class="login-wrapper">
  <div class="glass-card" style="width: 100%; max-width: 450px; padding: 2.5rem;">
    
    <div style="text-align: center; margin-bottom: 2rem;">
      <div style="width: 65px; height: 65px; background: rgba(255, 157, 0, 0.15); border: 1px solid var(--primary-accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem auto; box-shadow: var(--shadow-glow);">
        <i class="fa-solid fa-user-shield" style="font-size: 2rem; color: var(--primary-accent);"></i>
      </div>
      <h2 style="font-size: 1.8rem; font-weight: 800; margin-bottom: 0.4rem;">Admin Portal</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Sign in to access canteen live orders & management</p>
    </div>

    <form action="{{ url_for('admin_login') }}" method="POST">
      
      <div class="form-group">
        <label class="form-label" for="username"><i class="fa-solid fa-user"></i> Admin Username</label>
        <input type="text" id="username" name="username" class="form-control" placeholder="admin" required autofocus>
      </div>

      <div class="form-group" style="margin-bottom: 2rem;">
        <label class="form-label" for="password"><i class="fa-solid fa-lock"></i> Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
        <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 4px;">Default credentials: admin / admin123</div>
      </div>

      <button type="submit" class="btn-primary" style="width: 100%; padding: 0.9rem; font-size: 1.05rem;">
        Login to Dashboard <i class="fa-solid fa-arrow-right"></i>
      </button>

    </form>

    <div style="margin-top: 2rem; text-align: center; border-top: 1px solid var(--glass-border); padding-top: 1.25rem;">
      <a href="{{ url_for('login') }}" style="font-size: 0.9rem; color: var(--text-muted);">
        ← Back to Student Login
      </a>
    </div>

  </div>
</div>
{% endblock %}
